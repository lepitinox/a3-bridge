[package]
name = "a3_bridge"
version = "1.1.0"
edition = "2021"
description = "Arma 3 extension exposing the running scenario on a local HTTP + WebSocket gateway"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
httparse = "1.10.1"

[profile.release]
opt-level = 3
lto = true
# Panics are caught at the FFI boundary; aborting would take the game down.
panic = "unwind"
